<style>
  /* Layout: navy STI top bar; a module rail on the left (tabs on phones); one work area; KPI cards slide in from the right. */
  :root {
    --navy: #1B2D5B; --navy-2: #243A73; --cyan: #00A3E0; --green: #00A878; --silver: #8C8C8C;
    --bg: #F2F4F8; --paper: #FFFFFF; --paper-2: #F7F9FC; --ink: #1B2333; --ink-2: #47536A; --ink-3: #6B7488; --line: #DFE4EC;
    --good: #00875F; --good-dot: #00A878; --good-soft: #E2F5EE;
    --warn: #A86A00; --warn-dot: #E0A100; --warn-soft: #FFF3D9;
    --bad: #C23A3A; --bad-dot: #D64545; --bad-soft: #FCE9E9;
    --none: #6B7488; --none-dot: #B4BAC6; --none-soft: #EEF0F4;
    --cyan-soft: #E2F3FB; --navy-soft: #E7EBF4; --focus: #00A3E0;
    --shadow: 0 1px 2px rgba(27,45,91,.06), 0 4px 16px rgba(27,45,91,.06);
    --f-th: 'Sarabun', 'Open Sans', system-ui, sans-serif;
    --f-en: 'Open Sans', 'Sarabun', system-ui, sans-serif;
    --f-head: 'Rajdhani', 'Sarabun', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1628; --paper: #16213A; --paper-2: #1B2843; --ink: #E6EAF2; --ink-2: #B5BFD3; --ink-3: #8C97AE; --line: #2A3753;
      --good: #3CCB98; --good-soft: #10342A; --warn: #F0B54A; --warn-soft: #33290F; --bad: #F07A7A; --bad-soft: #3A1C21;
      --none: #9AA4B8; --none-soft: #222D45; --cyan-soft: #0F2E40; --navy-soft: #1E2A47; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1628; --paper: #16213A; --paper-2: #1B2843; --ink: #E6EAF2; --ink-2: #B5BFD3; --ink-3: #8C97AE; --line: #2A3753;
    --good: #3CCB98; --good-soft: #10342A; --warn: #F0B54A; --warn-soft: #33290F; --bad: #F07A7A; --bad-soft: #3A1C21;
    --none: #9AA4B8; --none-soft: #222D45; --cyan-soft: #0F2E40; --navy-soft: #1E2A47; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-th); -webkit-font-smoothing: antialiased; }
  html[lang="en"] body { font-family: var(--f-en); font-size: 14px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--f-head); margin: 0; line-height: 1.25; text-wrap: balance; }
  .num, td.n, .tile b, .score b { font-variant-numeric: tabular-nums; }

  /* Top bar: white STI logo, slogan, then the app's own STI K logo (the KPI app is not part of STI-X or Resin) */
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); color: #fff;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand > img { height: 26px; width: auto; display: block; }
  .slogan { font: 600 12px/1.35 var(--f-en); letter-spacing: 1px; color: var(--cyan); }
  .slogan span { display: block; letter-spacing: 0; font: 400 12px/1.35 'Sarabun', sans-serif; color: rgba(255,255,255,.75); }
  .appname { padding-left: 14px; border-left: 1px solid rgba(255,255,255,.25); line-height: 1.2; }
  .appname { display: flex; align-items: center; gap: 10px; }
  .appname img { height: 26px; width: auto; display: block; }
  .appname span { font-size: 12px; color: rgba(255,255,255,.65); }
  .tb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .demo-chip { font-size: 12px; color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 14px; padding: 3px 10px; white-space: nowrap; }
  .demo-chip i { color: var(--cyan); margin-right: 4px; }
  .tb-select { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 5px 8px; font-size: 13px; max-width: 230px; }
  .tb-select option { color: #1B2333; }
  .lang { display: inline-flex; border: 1px solid rgba(255,255,255,.3); border-radius: 16px; padding: 2px; }
  .lang button { background: none; border: 0; color: rgba(255,255,255,.75); padding: 3px 10px; border-radius: 14px; cursor: pointer; font-size: 12.5px; font-weight: 600; }
  .lang button[aria-pressed="true"] { background: var(--cyan); color: #fff; }
  @media (max-width: 1100px) { .slogan { display: none; } }
  @media (max-width: 640px) { .appname span, .demo-chip { display: none; } .tb-select { max-width: 160px; } }

  /* Shell */
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - var(--tbh, 56px)); }
  .rail { background: var(--paper); border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: var(--tbh, 56px); align-self: start; height: calc(100vh - var(--tbh, 56px)); overflow-y: auto; }
  .rail .grp { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-3); padding: 12px 12px 6px; }
  html[lang="th"] .rail .grp { letter-spacing: 0; text-transform: none; font-size: 12px; }
  .nav { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; color: var(--ink-2); font-size: 14.5px; }
  .nav i { font-size: 17px; width: 20px; color: var(--ink-3); }
  .nav:hover { background: var(--paper-2); color: var(--ink); }
  .nav[aria-current="page"] { background: var(--navy-soft); color: var(--navy); font-weight: 700; }
  :root[data-theme="dark"] .nav[aria-current="page"] { color: var(--ink); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nav[aria-current="page"] { color: var(--ink); } }
  .nav[aria-current="page"] i { color: var(--cyan); }
  .nav .badge { margin-left: auto; font: 700 11px/1 var(--f-en); background: var(--bad-dot); color: #fff; border-radius: 10px; padding: 3px 7px; }
  .nav .tag28 { margin-left: auto; font: 700 10.5px/1 var(--f-en); color: var(--cyan); border: 1px solid var(--cyan); border-radius: 10px; padding: 2px 6px; }
  .rail-foot { margin: 18px 12px 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }
  .rail-foot button { margin-top: 8px; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
  .work { min-width: 0; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
  .work-in { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
  @media (min-width: 1001px) { .work { padding-left: 28px; padding-right: 28px; } }
  @media (max-width: 1000px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .rail { position: sticky; top: var(--tbh, 56px); z-index: 20; height: auto; display: flex; gap: 4px; overflow-x: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
    .rail .grp, .rail-foot { display: none; }
    .nav { width: auto; white-space: nowrap; flex: none; padding: 7px 10px; font-size: 13.5px; }
  }

  /* Page head */
  .phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .phead h1 { font-size: 28px; color: var(--ink); }
  .phead p { margin: 2px 0 0; color: var(--ink-3); font-size: 14px; }
  .eyebrow { font: 700 12px/1.2 var(--f-en); letter-spacing: 1.2px; text-transform: uppercase; color: var(--cyan); margin-bottom: 4px; }
  html[lang="th"] .eyebrow { letter-spacing: 0; text-transform: none; font-family: var(--f-th); font-size: 13px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* Building blocks */
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
  .panel > h2 { font-size: 19px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel > h2 small { font: 400 13px var(--f-th); color: var(--ink-3); }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .g4, .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .g2, .g3, .g4, .g5 { grid-template-columns: minmax(0, 1fr); } }
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); padding: 7px 13px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink); }
  .btn:hover { border-color: var(--ink-3); }
  .btn.pri { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.go { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.ghost { background: none; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .inp, .sel, .ta { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 6px 9px; font-size: 14px; min-width: 0; }
  .ta { width: 100%; min-height: 72px; resize: vertical; }
  .inp:disabled, .sel:disabled, .ta:disabled { background: var(--paper-2); color: var(--ink-3); }
  .inp.err, .ta.err { border-color: var(--bad-dot); box-shadow: 0 0 0 2px var(--bad-soft); }
  label.f { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 12px; padding: 1px 9px; white-space: nowrap; background: var(--none-soft); color: var(--ink-2); }
  .chip.s { background: var(--navy-soft); color: var(--navy); font-family: var(--f-en); }
  :root[data-theme="dark"] .chip.s { color: var(--ink); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.s { color: var(--ink); } }
  .chip.erp { background: var(--cyan-soft); color: var(--cyan); }
  .chip.draft { background: var(--warn-soft); color: var(--warn); }
  .chip.ok { background: var(--good-soft); color: var(--good); }
  .chip.late { background: var(--bad-soft); color: var(--bad); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; border-radius: 12px; padding: 2px 10px 2px 8px; white-space: nowrap; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.none { background: var(--none-soft); color: var(--none); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.good { background: var(--good-dot); } .dot.warn { background: var(--warn-dot); } .dot.bad { background: var(--bad-dot); } .dot.none { background: var(--none-dot); }
  .note { border-radius: 8px; padding: 10px 14px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; background: var(--cyan-soft); color: var(--ink-2); }
  .note i { color: var(--cyan); font-size: 16px; line-height: 1.4; }
  .note.warn { background: var(--warn-soft); } .note.warn i { color: var(--warn); }
  .note.lock { background: var(--none-soft); } .note.lock i { color: var(--ink-3); }
  .muted { color: var(--ink-3); }
  .sample { font: 600 11px/1 var(--f-en); letter-spacing: .6px; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 3px 6px; }

  /* Tables */
  .tw { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; font-size: 12px; font-weight: 700; color: var(--ink-3); background: var(--paper-2); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--paper-2); }
  td.kname { min-width: 190px; }
  .kname b { display: block; font-weight: 600; color: var(--ink); }
  .kname span { font-size: 12.5px; color: var(--ink-3); }
  .code { font: 600 12px var(--f-en); color: var(--ink-3); white-space: nowrap; }

  /* Board */
  .tile { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
  .tile span { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .tile b { font: 700 30px/1.1 var(--f-head); color: var(--ink); }
  .month-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
  .month-tabs button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); border-right: 1px solid var(--line); }
  .month-tabs button:last-child { border-right: 0; }
  .month-tabs button[aria-pressed="true"] { background: var(--navy); color: #fff; font-weight: 700; }
  .goalrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 760px) { .goalrow { grid-template-columns: minmax(0, 1fr); } }
  .kbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--paper-2); cursor: pointer; text-align: left; display: grid; gap: 4px; width: 100%; }
  .kbox:hover { border-color: var(--ink-3); }
  .kbox .t { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .kbox .v { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .kbox .v b { font: 700 22px/1.1 var(--f-head); }
  .kbox .v small { color: var(--ink-3); font-size: 12.5px; }
  .scol { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .scol header { background: var(--navy); color: #fff; padding: 10px 14px; }
  .scol header b { font: 700 13px/1 var(--f-en); color: var(--cyan); letter-spacing: 1px; }
  .scol header div { font-weight: 600; font-size: 14.5px; line-height: 1.35; margin-top: 3px; }
  .scol ul { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
  .scol li button { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); }
  .scol li button:hover { background: var(--paper-2); }
  .scol li button .lbl { flex: 1; min-width: 0; }
  .scol li button .lbl em { display: block; font-style: normal; font-size: 12px; color: var(--ink-3); }
  .scol li.co button { color: var(--ink); font-weight: 600; }
  .scol li.sep { border-top: 1px dashed var(--line); margin: 4px 6px; }
  .tcard { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; cursor: pointer; text-align: left; width: 100%; }
  .tcard:hover { border-color: var(--ink-3); }
  .tcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .tcard .top b { display: block; font-size: 14.5px; color: var(--ink); }
  .tcard .top span { font-size: 12.5px; color: var(--ink-3); }
  .score { text-align: right; line-height: 1; }
  .score b { font: 700 26px/1 var(--f-head); color: var(--ink); }
  .score small { display: block; font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .tcard .dots { display: flex; gap: 5px; flex-wrap: wrap; }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(14,22,40,.45); z-index: 40; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--paper); z-index: 41; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.18);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .drawer header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
  .drawer header h2 { font-size: 21px; }
  .drawer header .x { margin-left: auto; background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--ink-3); line-height: 1; padding: 2px 4px; }
  .drawer .body { padding: 16px 20px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; margin: 0; }
  .drawer .body > * { flex: none; }
  .dl { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 12px; font-size: 14px; margin: 0; }
  .dl dt { color: var(--ink-3); } .dl dd { margin: 0; color: var(--ink); }
  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
  .chain i { color: var(--ink-3); }
  .hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px; }
  .hist li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; }
  .hist li span:first-child { color: var(--ink-3); font-size: 12.5px; }
  @media (max-width: 520px) { .dl { grid-template-columns: minmax(0, 1fr); } .dl dt { margin-top: 6px; } }

  /* Review */
  .steps { display: flex; gap: 0; flex-wrap: wrap; counter-reset: s; }
  .steps li { list-style: none; counter-increment: s; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-3); padding: 4px 14px 4px 0; }
  .steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--f-en); background: var(--none-soft); color: var(--ink-3); }
  .steps li.done { color: var(--good); } .steps li.done::before { content: "✓"; background: var(--good-dot); color: #fff; }
  .steps li.now { color: var(--ink); font-weight: 700; } .steps li.now::before { background: var(--cyan); color: #fff; }
  .steps li + li { padding-left: 14px; border-left: 1px solid var(--line); }
  .bigscore { display: flex; align-items: baseline; gap: 6px; }

  };

}

    ${rs.map(b => `<tr class="click" data-base="${b.c}" tabindex="0"><td class="code">${b.c}</td><td class="kname"><b>${esc(N(b))}</b>${S.lang === 'th' ? `<span>${esc(b.en)}</span>` : ''}</td><td>${esc(S.lang === 'en' ? b.tEn : b.tTh)}</td><td>${strip(b)}</td><td>${bpill(b)}</td><td>${lchips(b)}</td><td>${edit ? `<label class="sr" for="bd-${b.c}">${L('ข้อเสนอ', 'Proposed')}</label><select class="sel" id="bd-${b.c}" data-bdec="${b.c}">${Object.entries(BDEC).map(([k, v]) => `<option value="${k}" ${k === b.dec ? 'selected' : ''}>${esc(L(...v))}</option>`).join('')}</select>` : dchip(b.dec)}</td></tr>`).join('')}
    </tbody></table></div>`; }).join('') || `<p class="muted">${L('ไม่พบ KPI ตามเงื่อนไข', 'No KPI matches these filters')}</p>`}`;

  return `
  <div class="phead"><div><div class="eyebrow">${L('ทบทวน KPI พื้นฐาน · พ.ย.–ธ.ค. 2026 · อนุมัติพร้อมกันในระบบ ม.ค. 2027', 'Base KPI review · Nov–Dec 2026 · approved together in the app, Jan 2027')}</div><h1>${L('KPI เป้าหมาย + KPI พื้นฐานของฝ่าย', 'Goal KPIs + department base KPIs')}</h1><p>${L('KPI เป้าหมายจากกลยุทธ์ v3 วางคู่กับ KPI ที่แต่ละฝ่ายใช้อยู่ในปี 2026', 'The v3 goal KPIs side by side with the KPIs each department uses in 2026')}</p></div>

  <div class="note"><i class="bi bi-database-check"></i><div>${L('หน้านี้ใช้<b>ข้อมูลจริง</b>: KPI 60 ตัวของ 13 ฝ่าย จากทะเบียน S-DC-01 และรายงาน QMS KPI 2026 (ข้อมูลถึง 29 ต.ค. 2026 ไม่ระบุชื่อผู้รับผิดชอบ) ส่วน KPI เป้าหมายเป็นตัวอย่างใน v3 ที่ยังไม่มีค่าฐานและเป้า ข้อเสนอ (คงไว้ ปรับปรุง เชื่อม รวม …) เป็นจุดเริ่มต้นให้แต่ละฝ่ายยืนยันหรือเปลี่ยน', 'This page uses <b>real data</b>: 60 KPIs from 13 departments, from the S-DC-01 register and the QMS KPI 2026 report (data as of 29 Oct 2026; owner names not shown). The goal KPIs are the v3 samples, still without baselines or targets. Proposed decisions (keep, fix, link, merge …) are a starting point for each division to confirm or change.')}</div></div>
  <div class="grid g5">

    <div class="tile"><span><i class="bi bi-link-45deg"></i>${L('เชื่อมกับ v3 ได้', 'Link to v3')}</span><b>${linked}</b><span>${L('ไม่เชื่อม', 'not linked')} ${ks.length - linked}</span></div>
    <div class="tile"><span><span class="dot good"></span>${L('ผ่านทุกเดือน', 'Met every month')}</span><b>${n('met')}</b><span>${L('บางเดือน', 'some months')} ${n('mix')}</span></div>
    <div class="tile"><span><span class="dot bad"></span>${L('ไม่ผ่านทุกเดือน / ไม่มีตัวเลข', 'Missed every month / no figure')}</span><b>${n('miss') + n('none')}</b><span>${L('ไม่ผ่าน', 'missed')} ${n('miss')} · ${L('ไม่มีตัวเลข', 'no figure')} ${n('none')}</span></div>
  </div>
  <div class="tools"><span class="muted">${L('ข้อเสนอเบื้องต้น:', 'Proposed so far:')}</span>${decCount.map(([k, c]) => `<span class="chip d-${k}">${L(...BDEC[k])} ${c}</span>`).join('')}</div>

function vEntry() {

  const ks = teamKpis(team), sent = SUB[team][OPEN_MONTH];
  const row = k => {
    const v = val(k, OPEN_MONTH), a = ach(k, v, OPEN_MONTH), g = rag(a), erp = k.src === 'erp', e = S.errs[k.id] || {};
    const need = (g === 'warn' || g === 'bad');
    return `<tr><td class="kname"><b>${esc(N(k))}</b><span>${k.id} · ${esc(uLabel(k))}${k.ms ? ' · ' + L('เป้าสะสม', 'cumulative target') : ''}</span></td><td class="n">${fmt(target(k, OPEN_MONTH))}</td><td class="n muted">${fmt(val(k, LAST_CLOSED))}</td>
      <td class="n">${erp ? `<span class="num">${fmt(v)}</span> <span class="chip erp" title="${L('ดึงจาก ERP อัตโนมัติ', 'Read from the ERP')}">ERP</span>` : `<label class="sr" for="v-${k.id}">${esc(N(k))}</label><input class="inp num ${e.v ? 'err' : ''}" id="v-${k.id}" data-entry="${k.id}" inputmode="decimal" value="${esc(S.draft[k.id] ?? (k.a[OPEN_MONTH] ?? ''))}" style="width:96px;text-align:right" ${editable ? '' : 'disabled'}>`}</td>
      <td class="n" id="a-${k.id}">${pct(a)}</td><td id="g-${k.id}">${pill(g)}</td>
      <td><label class="sr" for="c-${k.id}">${L('ความเห็น', 'Comment')}</label><input class="inp ${e.c ? 'err' : ''}" id="c-${k.id}" data-comment="${k.id}" placeholder="${need ? L('จำเป็น: สาเหตุและสิ่งที่จะทำ', 'Required: cause and next step') : L('ไม่บังคับ', 'Optional')}" value="${esc((S.draft['c:' + k.id]) || '')}" style="width:100%;min-width:180px" ${editable ? '' : 'disabled'}></td>
      <td><label class="btn ghost" style="padding:4px 9px;font-size:13px;${editable ? '' : 'opacity:.45'}"><i class="bi bi-paperclip"></i><span id="f-${k.id}">${esc(S.draft['f:' + k.id] || L('แนบ', 'Attach'))}</span><input type="file" data-file="${k.id}" class="sr" ${editable ? '' : 'disabled'}></label></td></tr>`;
  };
  return `
  <div class="phead"><div><div class="eyebrow">M3 · ${L('รอบ พ.ค. 2027', 'Period May 2027')}</div><h1>${L('บันทึกผลรายเดือน', 'Monthly results')}</h1><p>${L('กรอกผลภายในวันทำการที่ 5 ของเดือนถัดไป สถานะคำนวณให้อัตโนมัติ ผลสีเหลืองหรือแดงต้องมีความเห็น', 'Enter results by the 5th working day of the next month. Status is calculated for you; amber or red results need a comment.')}</p></div>
  <div class="tools"><label class="sr" for="entryTeam">${L('ทีม', 'Team')}</label><select class="sel" id="entryTeam" ${r.team ? 'disabled' : ''}>${TEAMS.map(t => `<option value="${t.id}" ${t.id === team ? 'selected' : ''}>${esc(N(t))}</option>`).join('')}</select>
  ${sent ? `<span class="chip ok"><i class="bi bi-check2"></i>${L('ส่งผลแล้ว', 'Sent')}</span>` : `<span class="chip late"><i class="bi bi-exclamation-circle"></i>${L('เลยกำหนด 7 มิ.ย. มา 2 วัน', '2 days past 7 Jun due date')}</span>`}</div></div>
  ${!can('enter') ? `<div class="note lock"><i class="bi bi-eye"></i><div>${L('บทบาทนี้ดูได้อย่างเดียว ผู้บันทึกข้อมูลและเจ้าของ KPI ของแต่ละทีมเป็นผู้กรอกผล', 'This role can only view. Each team\'s data-entry person and KPI owner enter results.')}</div></div>` : r.team && r.team !== team ? '' : sent ? `<div class="note"><i class="bi bi-lock"></i><div>${L('ส่งผลเดือนนี้แล้ว หากต้องแก้ไข ให้ขอเปิดใหม่จาก HR', 'This month has been sent. To change it, ask HR to reopen the period.')}</div></div>` : ''}
  <div class="tw"><table><thead><tr><th>KPI</th><th class="n">${L('เป้า', 'Target')}</th><th class="n">${mon(LAST_CLOSED)}</th><th class="n">${L('ผล', 'Result')} ${mon(OPEN_MONTH)}</th><th class="n">${L('ความสำเร็จ', 'Achieved')}</th><th>${L('สถานะ', 'Status')}</th><th>${L('ความเห็น', 'Comment')}</th><th>${L('หลักฐาน', 'Evidence')}</th></tr></thead><tbody>${ks.map(row).join('')}</tbody></table></div>
  <div id="entryErr"></div>

  <section class="panel"><h2>${L('สถานะการส่งผล พ.ค. ทุกทีม', 'May reporting, all teams')}</h2><div class="tools">${TEAMS.map(t => `<span class="chip ${SUB[t.id][OPEN_MONTH] ? 'ok' : 'late'}">${esc(N(t))}</span>`).join('')}</div><p class="muted" style="margin:10px 0 0;font-size:13px">${L('ระบบส่งข้อความเตือนวันที่ 3, 5 และ 7 ของเดือน และแสดง "เลยกำหนด" บนกระดานภาพรวม', 'Reminders go out on the 3rd, 5th and 7th; late teams show as overdue on the company board.')}</p></section>`;
}

function vReview() {
  const r = role(), team = r.team || S.revTeam, R = REV[team], ks = teamKpis(team), Q = [0, 1, 2];
  const ownerCan = can('self') && r.team === team && R.stage === 0, revCan = can('review') && R.stage === 1;
  const sysScore = k => { const p = periodVal(k, Q); return scoreOf(ach(k, p.v, p.m)); };
  const final = teamScore(team, Q, k => R.rev[k.id] ?? R.self[k.id] ?? sysScore(k));
  const sel = (map, k, on, kind) => `<label class="sr" for="${kind}-${k.id}">${kind}</label><select class="sel" id="${kind}-${k.id}" data-score="${kind}" data-id="${k.id}" ${on ? '' : 'disabled'}><option value="">—</option>${[5, 4, 3, 2, 1].map(s => `<option ${map[k.id] === s ? 'selected' : ''}>${s}</option>`).join('')}</select>`;
  const steps = [L('เจ้าของประเมินตนเอง', 'Owner self-assessment'), L('ผู้ตรวจประเมินและลงนาม', 'Reviewer assessment and sign-off'), L('เสร็จสิ้น', 'Complete')];
  return `
  <div class="phead"><div><div class="eyebrow">M4 · M5 · ${L('ไตรมาส 1 ปี 2027 (ม.ค.–มี.ค.)', 'Q1 2027 (Jan–Mar)')}</div><h1>${L('ทบทวนรายไตรมาส', 'Quarterly review')}</h1><p>${L('ผลไตรมาสเติมให้อัตโนมัติ เจ้าของประเมินตนเอง ผู้ตรวจประเมินและลงนาม คะแนนของผู้ตรวจใช้เป็นผลจริง', 'Quarter results are filled in for you. The owner self-assesses; the reviewer assesses and signs. The reviewer\'s score counts.')}</p></div>
  <div class="tools"><label class="sr" for="revTeam">${L('ทีม', 'Team')}</label><select class="sel" id="revTeam" ${r.team ? 'disabled' : ''}>${TEAMS.map(t => `<option value="${t.id}" ${t.id === team ? 'selected' : ''}>${esc(N(t))} · ${REV[t.id].stage === 2 ? L('ลงนามแล้ว', 'signed') : REV[t.id].stage === 1 ? L('รอผู้ตรวจ', 'with reviewer') : L('ร่าง', 'draft')}</option>`).join('')}</select></div></div>
  <section class="panel"><ol class="steps" style="margin:0;padding:0">${steps.map((s, i) => `<li class="${i < R.stage ? 'done' : i === R.stage ? 'now' : ''}">${s}</li>`).join('')}</ol></section>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) 240px">
    <div class="tw"><table><thead><tr><th>KPI</th><th class="n">${L('ผล Q1', 'Q1 result')}</th><th class="n">${L('เป้า', 'Target')}</th><th class="n">${L('ความสำเร็จ', 'Achieved')}</th><th class="n">${L('คะแนนระบบ', 'System')}</th><th>${L('ตนเอง', 'Self')}</th><th>${L('ผู้ตรวจ', 'Reviewer')}</th><th class="n">${L('น้ำหนัก', 'Weight')}</th></tr></thead><tbody>
    ${ks.map(k => { const p = periodVal(k, Q), a = ach(k, p.v, p.m); return `<tr><td class="kname"><b>${esc(N(k))}</b><span>${k.id}</span></td><td class="n">${fmt(p.v)}</td><td class="n">${fmt(target(k, p.m))}</td><td class="n">${pct(a)} <span class="dot ${rag(a)}"></span></td><td class="n">${scoreOf(a) ?? '—'}</td><td>${sel(R.self, k, ownerCan, 'self')}</td><td>${sel(R.rev, k, revCan, 'rev')}</td><td class="n">${k.w}%</td></tr>`; }).join('')}
    </tbody></table></div>
    <section class="panel"><div class="muted" style="font-size:13px">${L('คะแนนทีม (ถ่วงน้ำหนัก)', 'Team score (weighted)')}</div><div class="bigscore"><b>${final == null ? '—' : final.toFixed(2)}</b><span>/ 5</span></div><p class="muted" style="font-size:12.5px;margin:6px 0 0">${L('ใช้คะแนนผู้ตรวจ ถ้ายังไม่มีใช้คะแนนตนเอง แล้วจึงใช้คะแนนระบบ', 'Uses the reviewer score, then the self score, then the system score.')}</p></section>
  </div>
  <div class="grid g2">
    <label class="f">${L('จุดเด่นของไตรมาส', 'Highlights')}<textarea class="ta" data-rtext="hi" ${ownerCan ? '' : 'disabled'}>${esc(R.hi)}</textarea></label>
    <label class="f">${L('ปัญหาและสาเหตุ', 'Issues and causes')}<textarea class="ta" data-rtext="issues" ${ownerCan ? '' : 'disabled'}>${esc(R.issues)}</textarea></label>
  </div>
  <section class="panel"><h2>${L('แผนการแก้ไข', 'Actions')} <small>${L('ติดตามต่อในไตรมาสถัดไป', 'carried into next quarter')}</small></h2>
    ${R.actions.length ? `<div class="tw" style="margin-bottom:12px"><table><thead><tr><th>${L('สิ่งที่จะทำ', 'Action')}</th><th>${L('ผู้รับผิดชอบ', 'Owner')}</th><th>${L('กำหนดเสร็จ', 'Due')}</th><th>${L('สถานะ', 'Status')}</th></tr></thead><tbody>${R.actions.map(a => `<tr><td>${esc(a.a)}</td><td>${esc(a.o)}</td><td>${esc(a.d)}</td><td>${a.s === 'done' ? `<span class="chip ok">${L('เสร็จแล้ว', 'Done')}</span>` : `<span class="chip">${L('กำลังทำ', 'Open')}</span>`}</td></tr>`).join('')}</tbody></table></div>` : `<p class="muted">${L('ยังไม่มีแผนการแก้ไข', 'No actions yet.')}</p>`}
    ${ownerCan || revCan ? `<div class="rowform"><label class="f">${L('สิ่งที่จะทำ', 'Action')}<input class="inp" id="actA"></label><label class="f">${L('ผู้รับผิดชอบ', 'Owner')}<input class="inp" id="actO"></label><label class="f">${L('กำหนดเสร็จ', 'Due')}<input class="inp" id="actD" placeholder="${L('เช่น 31 ก.ค. 2027', 'e.g. 31 Jul 2027')}"></label><button class="btn" type="button" data-act="addAction"><i class="bi bi-plus"></i>${L('เพิ่ม', 'Add')}</button></div>` : ''}
  </section>
  <section class="panel"><h2>${L('คำขอปรับเป้า', 'Target-change requests')}</h2>
    ${R.changes.length ? R.changes.map((c, i) => `<div class="tools" style="justify-content:space-between;border-top:1px solid var(--line);padding:10px 0 0;margin-top:6px"><div class="kname"><b>${esc(c.k)} · ${esc(N(kpi(c.k)))}: ${fmt(c.from)} → ${fmt(c.to)}</b><span>${esc(c.why)}</span></div><div class="tools">${c.s === 'pending' ? `<span class="chip draft">${L('รออนุมัติ', 'Pending')}</span>${revCan ? `<button class="btn go" type="button" data-act="approveChange" data-i="${i}">${L('อนุมัติ', 'Approve')}</button>` : ''}` : `<span class="chip ok">${L('อนุมัติแล้ว เก็บเป้าเดิมไว้ในประวัติ', 'Approved; original target kept in history')}</span>`}</div></div>`).join('') : `<p class="muted">${L('ไม่มีคำขอ', 'No requests.')}</p>`}
  </section>
  <div id="revErr"></div>
  <div class="tools" style="justify-content:flex-end">
    ${ownerCan ? `<button class="btn pri" type="button" data-act="sendReview"><i class="bi bi-send"></i>${L('ส่งให้ผู้ตรวจ', 'Send to reviewer')}</button>` : ''}
    ${revCan ? `<button class="btn go" type="button" data-act="signReview"><i class="bi bi-pen"></i>${L('ลงนามรับรองผลไตรมาส', 'Sign off the quarter')}</button>` : ''}
    ${R.stage === 2 ? `<span class="chip ok"><i class="bi bi-patch-check"></i>${L('ลงนามแล้ว ผลไตรมาสถูกล็อก', 'Signed; quarter results locked')}</span>` : ''}
    ${!ownerCan && !revCan && R.stage < 2 ? `<span class="muted" style="font-size:13px">${R.stage === 0 ? L('รอเจ้าของ KPI ของทีมประเมินตนเอง', 'Waiting for the team\'s KPI owner to self-assess') : L('รอสภากลยุทธ์หรือผู้บริหารประเมินและลงนาม', 'Waiting for the Council or Executive to assess and sign')}</span>` : ''}
  </div>`;
}

function vYearEnd() {
  const r = role(), team = r.team || S.yeTeam, Y = YE[team], ms = [0, 1, 2, 3, 4], ks = teamKpis(team);
  const sAvg = s => { const xs = live().filter(k => strategyOf(k) === s.id).map(k => { const p = periodVal(k, ms); return scoreOf(ach(k, p.v, p.m)); }).filter(x => x != null); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; };
  const signers = [['signOwner', L('เจ้าของ KPI', 'KPI owner')], ['review', L('ผู้ตรวจ (สภากลยุทธ์)', 'Reviewer (Council)')], ['signExec', L('ผู้บริหาร (MD)', 'Executive (MD)')]];
  const nextOk = Y.sign < 3 && can(signers[Y.sign][0]) && (Y.sign !== 0 || r.team === team);
  const sc = teamScore(team, ms);
  return `

function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function chart(k) {
  const ms = [0, 1, 2, 3, 4], vs = ms.map(m => val(k, m)), ts = ms.map(m => target(k, m));
  const all = [...vs, ...ts].filter(v => v != null), lo = Math.min(0, ...all), step = niceStep((Math.max(...all) - lo) / 3 || 1), hi = Math.ceil(Math.max(...all) * 1.08 / step) * step || step;
  const W = 480, H = 170, P = { l: 40, r: 10, t: 12, b: 26 }, iw = W - P.l - P.r, ih = H - P.t - P.b, bw = iw / ms.length;
  const y = v => P.t + ih - (v - lo) / (hi - lo) * ih;
  const ticks = []; for (let g = Math.floor(lo / step) * step; g <= hi + 1e-9; g += step) ticks.push(Math.round(g * 1e6) / 1e6);
  const grid = ticks.map(g => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}" style="stroke:var(--line)"/><text x="${P.l - 6}" y="${y(g) + 4}" text-anchor="end" font-size="11" style="fill:var(--ink-3)">${fmt(g)}</text>`).join('');
  const bars = ms.map((m, i) => { const v = vs[i], x = P.l + i * bw + bw * .22, w = bw * .56; const g = rag(ach(k, v, m)); return (v == null ? '' : `<rect x="${x}" y="${Math.min(y(v), y(Math.max(lo, 0)))}" width="${w}" height="${Math.abs(y(v) - y(Math.max(lo, 0))) || 1}" rx="3" style="fill:var(--${g}-dot)"><title>${mon(m)}: ${fmt(v)}</title></rect>`) + `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="11" style="fill:var(--ink-3)">${mon(m)}</text>`; }).join('');
  const tl = ms.map((m, i) => `${i ? 'L' : 'M'}${P.l + i * bw + bw / 2} ${y(ts[i])}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${L('ผลรายเดือนเทียบเป้า', 'Monthly results against target')}">${grid}${bars}<path d="${tl}" style="fill:none;stroke:var(--cyan)" stroke-width="2" stroke-dasharray="5 4"/></svg><div class="muted" style="font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap"><span><span class="dot good"></span> ${L('ผลรายเดือน (สีตามสถานะ)', 'Monthly result (coloured by status)')}</span><span>- - ${L('เป้า', 'Target')}</span></div>`;
}

function chartBase(b) {

  const lo = Math.min(0, ...all), step = niceStep((Math.max(...all) - lo) / 3 || 1), hi = Math.ceil(Math.max(...all) * 1.08 / step) * step || step;
  const W = 480, H = 170, P = { l: 52, r: 10, t: 12, b: 26 }, iw = W - P.l - P.r, ih = H - P.t - P.b, bw = iw / 12, y = v => P.t + ih - (v - lo) / (hi - lo) * ih;

  if (g('nBase').value === '' || Number.isNaN(base)) { errs.push(L('ใส่ค่าฐานเป็นตัวเลข', 'Enter the baseline as a number')); g('nBase').classList.add('err'); }
  if (g('nTgt').value === '' || Number.isNaN(tgt)) { errs.push(L('ใส่เป้าเป็นตัวเลข', 'Enter the target as a number')); g('nTgt').classList.add('err'); }
  if (!par) { errs.push(L('เลือก KPI บริษัทหรือกลยุทธ์ที่ KPI นี้ช่วย KPI ที่ไม่เชื่อมโยงอนุมัติไม่ได้', 'Choose the company KPI or strategy this KPI serves. Unlinked KPIs cannot be approved.')); g('nPar').classList.add('err'); }
  if (errs.length) { g('addErr').innerHTML = `<div class="note warn"><i class="bi bi-exclamation-triangle"></i><div>${errs.map(esc).join('<br>')}</div></div>`; return; }
  const team = role().team, n = KPIS.filter(k => k.unit === team).length + 1;
  const k = K(`${team}-${String(n).padStart(2, '0')}`, team, par, th, g('nEn').value.trim() || th, g('nU').value.trim() || '%', g('nDir').value, base, tgt, Number(g('nW').value) || 0, g('nSrc').value, [], { status: 'submitted', submittedOn: L('วันนี้', 'today') });
  KPIS.push(k); log(L('เสนอ KPI ใหม่ ', 'Proposed new KPI ') + k.id + ' ' + th);
  S.drawer = null; toast(L('ส่งเพื่ออนุมัติแล้ว ลองเปลี่ยนมุมมองเป็นสภากลยุทธ์เพื่ออนุมัติ', 'Sent for approval. Switch the view to Strategy Council to approve it.')); render();
});

function submitEntry(team) {
  const ks = teamKpis(team).filter(k => k.src === 'manual'), errs = []; S.errs = {};
  teamKpis(team).forEach(k => {
    const raw = k.src === 'erp' ? String(k.a[OPEN_MONTH] ?? '') : String(S.draft[k.id] ?? (k.a[OPEN_MONTH] ?? '')).trim(), v = Number(raw);
    if (k.src === 'manual' && (raw === '' || Number.isNaN(v))) { S.errs[k.id] = { v: 1 }; errs.push(`${N(k)}: ${L('ยังไม่ได้กรอกผล', 'result missing')}`); return; }
    const g = rag(ach(k, v, OPEN_MONTH));
    if ((g === 'warn' || g === 'bad') && !(S.draft['c:' + k.id] || '').trim()) { S.errs[k.id] = Object.assign(S.errs[k.id] || {}, { c: 1 }); errs.push(`${N(k)}: ${L('ผลต่ำกว่าเป้า ใส่สาเหตุและสิ่งที่จะทำ', 'below target, add the cause and next step')}`); }
  });
  if (errs.length) { render(); document.getElementById('entryErr').innerHTML = `<div class="note warn"><i class="bi bi-exclamation-triangle"></i><div><b>${L('ยังส่งไม่ได้', 'Not sent yet')}</b><br>${errs.map(esc).join('<br>')}</div></div>`; return; }
  ks.forEach(k => { k.a[OPEN_MONTH] = Number(S.draft[k.id] ?? k.a[OPEN_MONTH]); delete S.draft[k.id]; });
  SUB[team][OPEN_MONTH] = 1; log(L('ส่งผลเดือน พ.ค. ', 'Sent May results ') + N(unit(team)));
  toast(L('ส่งผลแล้ว กระดานภาพรวมอัปเดตแล้ว', 'Sent. The company board is updated.')); render();
}
function reviewStep(kind, stage) {
  const t = role().team || S.revTeam, R = REV[t], miss = teamKpis(t).filter(k => !R[kind][k.id]);
  if (miss.length) { document.getElementById('revErr').innerHTML = `<div class="note warn"><i class="bi bi-exclamation-triangle"></i><div>${L('ให้คะแนนให้ครบทุก KPI ก่อน: ', 'Score every KPI first: ')}${miss.map(k => esc(N(k))).join(', ')}</div></div>`; return; }
  R.stage = stage; log((stage === 1 ? L('ส่งทบทวนไตรมาส 1 ให้ผู้ตรวจ ', 'Sent Q1 review to reviewer ') : L('ลงนามทบทวนไตรมาส 1 ', 'Signed Q1 review ')) + N(unit(t)));
  toast(stage === 1 ? L('ส่งให้ผู้ตรวจแล้ว', 'Sent to the reviewer.') : L('ลงนามแล้ว ผลไตรมาสถูกล็อก', 'Signed. Quarter results locked.')); render();
}

function setTbh() { document.documentElement.style.setProperty('--tbh', document.querySelector('.topbar').offsetHeight + 'px'); }
window.addEventListener('resize', setTbh);
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== S.view) go(v); });

/* ───────────── Start ───────────── */
const start = (location.hash || '').slice(1);
S.view = VIEWS[start] ? start : 'board';
render();
</script>
</body>
</html>
